[project]
name = "memo"
version = "0.1.0"
description = "Memorization app backend — cards, import pipeline, scheduling"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-ulid>=2.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "fsrs>=6.3.2",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
]

[project.scripts]
memo = "memo.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
